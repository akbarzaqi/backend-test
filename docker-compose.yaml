services:
  postgres:
    image: postgres:17
    container_name: inventory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: intern_test
      POSTGRES_PASSWORD: intern_test123
      POSTGRES_DB: intern_test_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: